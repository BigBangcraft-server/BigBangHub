messages: {}

experience:
  sound-enabled: true
  title-enabled: true
  actionbar-enabled: true

  match-found:
    title: "§a§lPARTIDA ENCONTRADA!"
    subtitle: "§fConectando ao servidor em instantes..."
    sound: "entity.player.levelup"
    volume: 1.0
    pitch: 1.0

  reconnect-available:
    title: "§e§lPARTIDA EM ANDAMENTO"
    subtitle: "§7Clique no chat ou use §a/reconnect"
    sound: "block.note_block.pling"
    volume: 1.0
    pitch: 1.2

  rematch-offered:
    title: "§b§lVOTO DE REVANCHE"
    subtitle: "§7Um jogador votou por revanche!"
    sound: "block.note_block.bell"
    volume: 1.0
    pitch: 1.0

  rematch-consensus:
    title: "§a§lREVANCHE ACEITA!"
    subtitle: "§fPreparando nova rodada..."
    sound: "entity.player.levelup"
    volume: 1.0
    pitch: 1.5

  party-invite-received:
