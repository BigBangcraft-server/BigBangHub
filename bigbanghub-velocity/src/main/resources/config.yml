# BigBangHub Velocity proxy configuration
proxy:
  channel: bigbanghub:main
  protocol-version: 1
  hub-server-name: hubminigame
  shared-secret-environment: BIGBANGHUB_MESSAGE_SECRET
  require-hmac: false
  max-payload-bytes: 16384

registry:
  heartbeat-timeout: 10s
  suspect-threshold: 5s
  fallback-to-hub: true
  allowed:
    "campominado-*":
      game-id: campominado
    "bedwars-*":
      game-id: bedwars

routing:
  reservation-ttl: 10s

match:
  admission-timeout: 10s
  return-timeout: 10s
  finished-retention: 60s
  auto-create-match: true
  reconnect-timeout: 60s
  auto-reconnect: true
  post-match-timeout: 15s

# NOTA: nenhum alias de minigame no proxy de propósito — os plugins de backend
# são donos desses comandos e um alias global no proxy os intercepta em TODOS os
# servidores, impedindo os admins de usarem o comando do plugin:
#  - /campominado -> BigBangMinefield (backend campominado, sem alias desde 0.4.6)
#  - /bedwars     -> MBedwars (backend bedwars; também expõe /bw)
#  - /hg          -> BigBangHungerGames (backend hg, ex.: /hg setpos1)
# Entrada nas filas continua por /queue join <game>, bússola e NPC do Hub.
aliases: {}
allow-console-commands: false
console-command-allowlist: []
