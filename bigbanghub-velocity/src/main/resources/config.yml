# BigBangHub Velocity proxy configuration
proxy:
  channel: bigbanghub:main
  protocol-version: 1
  hub-server-name: hubminigame
  shared-secret-environment: BIGBANGHUB_MESSAGE_SECRET
  require-hmac: false
  max-payload-bytes: 16384

registry:
  heartbeat-timeout: 10s
  suspect-threshold: 5s
  fallback-to-hub: true
  allowed:
    "campominado-*":
      game-id: campominado
    "bedwars-*":
      game-id: bedwars

routing:
  reservation-ttl: 10s

match:
  admission-timeout: 10s
  return-timeout: 10s
  finished-retention: 60s
  auto-create-match: true
  reconnect-timeout: 60s
  auto-reconnect: true
  post-match-timeout: 15s

aliases:
  # NOTA: sem alias 'campominado' de propósito — o plugin BigBangMinefield é dono
  # de /campominado no backend campominado, e alias no proxy interceptaria global.
  # Entrada via fila continua por /queue join campominado, bússola e NPC (hub).
  bedwars: bedwars
  hg: hg
allow-console-commands: false
console-command-allowlist: []
