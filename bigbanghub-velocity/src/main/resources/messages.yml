  actionbar-format: "§eParty: {role} §8| §7Membros: §f{members_online}/{members_total} §8| §7Status: {status}"
  leader-role: "§6★ Líder"
  member-role: "§7• Membro"
  status:
    idle: "§aLobby"
    queued: "§eNa Fila"
